# =============================================================================
# 仅对外暴露 80（跳转 HTTPS）、443；mall-admin / mall-portal / mall-search 只监听本机回环，由 Nginx 反代。
#
# 部署要点：
# 1) DNS：为下列域名添加 A 记录指向本机公网 IP
#    - admin.yourdomain.com   → 管理后台静态页 + mall-admin API
#    - portal.yourdomain.com   → mall-portal
#    - search.yourdomain.com   → mall-search
# 2) 证书：将 ssl_certificate 路径换成实际文件（Let's Encrypt / 云厂商证书）
# 3) Docker：后端端口不要对公网开放，建议仅绑定宿主机环回，例如：
#    -p 127.0.0.1:8080:8080  -p 127.0.0.1:8085:8085  -p 127.0.0.1:8081:8081
#    安全组只放行 80、443
# 4) 若 Nginx 在容器内而 Java 在宿主机：将下面 127.0.0.1 改为 172.17.0.1（或 docker0 网关）
# =============================================================================

upstream mall_admin {
    server 127.0.0.1:8080;
}

upstream mall_portal {
    server 127.0.0.1:8085;
}

upstream mall_search {
    server 127.0.0.1:8081;
}

# ---------- HTTP：统一跳转 HTTPS ----------
server {
    listen       80;
    server_name  admin.yourdomain.com portal.yourdomain.com search.yourdomain.com;
    return 301 https://$host$request_uri;
}

# ---------- 管理后台前端 + mall-admin API（同源，前端 VITE_BASE_SERVER_URL 留空）----------
server {
    listen       443 ssl http2;
    server_name  admin.yourdomain.com;

    ssl_certificate      /etc/nginx/ssl/admin.yourdomain.com/fullchain.pem;
    ssl_certificate_key  /etc/nginx/ssl/admin.yourdomain.com/privkey.pem;
    # ssl_trusted_certificate /etc/nginx/ssl/admin.yourdomain.com/chain.pem;

    root   /usr/share/nginx/html;
    index  index.html;

    access_log  /var/log/nginx/mall-admin.access.log  main;
    error_log   /var/log/nginx/mall-admin.error.log  warn;

    client_max_body_size 20m;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/(admin|role|resource|resourceCategory|menu|memberLevel|home|flashSession|flashProductRelation|flash|couponHistory|coupon|sku|product|productCategory|productAttribute|brand|aliyun|orderSetting|returnReason|returnApply|order|companyAddress|minio|subject|prefrenceArea|swagger-ui|v3|druid|webjars) {
        proxy_pass       http://mall_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- mall-portal ----------
server {
    listen       443 ssl http2;
    server_name  portal.yourdomain.com;

    ssl_certificate      /etc/nginx/ssl/portal.yourdomain.com/fullchain.pem;
    ssl_certificate_key  /etc/nginx/ssl/portal.yourdomain.com/privkey.pem;

    access_log  /var/log/nginx/mall-portal.access.log  main;
    error_log   /var/log/nginx/mall-portal.error.log  warn;

    client_max_body_size 20m;

    location / {
        proxy_pass       http://mall_portal;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# ---------- mall-search ----------
server {
    listen       443 ssl http2;
    server_name  search.yourdomain.com;

    ssl_certificate      /etc/nginx/ssl/search.yourdomain.com/fullchain.pem;
    ssl_certificate_key  /etc/nginx/ssl/search.yourdomain.com/privkey.pem;

    access_log  /var/log/nginx/mall-search.access.log  main;
    error_log   /var/log/nginx/mall-search.error.log  warn;

    location / {
        proxy_pass       http://mall_search;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
